<div class="flex flex-col h-screen bg-gray-50">
  <header class="bg-gradient-to-r from-primary-700 to-primary-600 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">💰 PrecioLocal</h1>
        <div class="text-sm">Carrito: {{ cartCount }} | Total: ${{ cartTotal | number: '1.2-2' }}</div>
      </div>
    </div>
  </header>

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 flex gap-6 overflow-x-auto whitespace-nowrap">
      <a routerLink="/" routerLinkActive="border-b-2 border-primary-700 text-primary-700"
         [routerLinkActiveOptions]="{ exact: true }"
         class="px-4 py-3 font-semibold text-gray-600 hover:text-primary-700">
        🔍 Buscar
      </a>
      <a routerLink="/upload" routerLinkActive="border-b-2 border-primary-700 text-primary-700"
         class="px-4 py-3 font-semibold text-gray-600 hover:text-primary-700">
        📸 Cargar Precio
      </a>
      <a routerLink="/cart" routerLinkActive="border-b-2 border-primary-700 text-primary-700"
         class="px-4 py-3 font-semibold text-gray-600 hover:text-primary-700">
        🛒 Mi Carrito
      </a>
      <a routerLink="/purchases" routerLinkActive="border-b-2 border-primary-700 text-primary-700"
         class="px-4 py-3 font-semibold text-gray-600 hover:text-primary-700">
        📋 Historial
      </a>
      <a routerLink="/calculadora" routerLinkActive="border-b-2 border-primary-700 text-primary-700"
         class="px-4 py-3 font-semibold text-gray-600 hover:text-primary-700">
        🧮 Calculadora
      </a>
    </div>
  </nav>

  <main class="flex-1 overflow-y-auto max-w-6xl mx-auto w-full px-4 py-6">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 text-white text-center py-3 text-xs">
    PrecioLocal © 2024 - PWA para comparar precios
  </footer>
</div>
