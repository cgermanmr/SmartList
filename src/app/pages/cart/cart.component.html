<div>
  <h1 class="text-3xl font-bold mb-6">Mi Carrito</h1>

  <div *ngIf="cart.length === 0" class="text-center py-12">
    <p class="text-gray-500 text-lg mb-4">Tu carrito está vacío</p>
    <a href="/" class="btn-primary inline-block">Volver a Buscar</a>
  </div>

  <div *ngIf="cart.length > 0">

    <!-- Items del carrito -->
    <div class="grid grid-cols-1 gap-4 mb-6">
      <div *ngFor="let item of cart" class="card p-4">
        <div class="flex justify-between items-start mb-3">
          <div>
            <h3 class="font-bold">{{ item.productName }}</h3>
            <span *ngIf="getPriceStatus(item) !== 'new'"
                  [ngClass]="getPriceClass(item)"
                  class="text-xs font-semibold">
              {{ getPriceBadge(item) }}
            </span>
          </div>
          <button (click)="removeItem(item.id)" class="text-red-500 hover:text-red-700 text-xl ml-2">
            ✕
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600">Precio $</label>
            <input
              type="number"
              [ngModel]="item.price"
              (ngModelChange)="updateItemPrice(item.id, $event)"
              min="0"
              step="0.01"
              class="input-field w-28"
            >
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600">Cantidad</label>
            <input
              type="number"
              [(ngModel)]="item.quantity"
              (ngModelChange)="updateQuantity(item.id, item.quantity)"
              min="1"
              class="input-field w-20"
            >
          </div>
          <span class="text-lg font-bold text-primary-700 ml-auto">
            ${{ item.subtotal | number: '1.2-2' }}
          </span>
        </div>
      </div>
    </div>

    <!-- Misma compra en un comercio -->
    <div class="card p-4 mb-6">
      <label class="flex items-center gap-3 cursor-pointer select-none">
        <input type="checkbox" [(ngModel)]="isSingleStore" class="w-4 h-4 accent-primary-600">
        <span class="font-medium">¿Compra en un mismo comercio?</span>
      </label>

      <div *ngIf="isSingleStore" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-gray-600 block mb-1">Barrio</label>
          <input
            type="text"
            [(ngModel)]="storeBarrio"
            placeholder="Ej: Caballito"
            class="input-field w-full"
          >
        </div>
        <div>
          <label class="text-sm text-gray-600 block mb-1">Comercio</label>
          <input
            type="text"
            [(ngModel)]="storeName"
            placeholder="Ej: Supermercado Norte"
            class="input-field w-full"
          >
        </div>
      </div>
    </div>

    <!-- Total -->
    <div class="bg-green-50 border-2 border-green-500 rounded-lg p-6 mb-6">
      <p class="text-3xl font-bold text-green-700">
        Total: ${{ getTotal() | number: '1.2-2' }}
      </p>
    </div>

    <!-- Botones principales -->
    <div *ngIf="!showPaymentStep" class="flex gap-4">
      <button (click)="clearCart()" class="btn-secondary flex-1">
        Limpiar Carrito
      </button>
      <button (click)="checkout()" class="btn-primary flex-1">
        Finalizar Compra
      </button>
    </div>

    <!-- Paso: selección de medio de pago -->
    <div *ngIf="showPaymentStep" class="card p-5">
      <h2 class="font-bold text-lg mb-4">¿Con qué medio de pago?</h2>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
        <button
          *ngFor="let m of paymentMethods"
          (click)="selectedPayment = m.label"
          class="flex flex-col items-center gap-1 p-3 rounded-lg border-2 text-sm font-medium transition-colors"
          [ngClass]="selectedPayment === m.label
            ? 'border-primary-600 bg-primary-50 text-primary-700'
            : 'border-gray-200 hover:border-primary-300 text-gray-700'"
        >
          <span class="text-2xl">{{ m.icon }}</span>
          {{ m.label }}
        </button>
      </div>

      <div class="flex gap-3">
        <button (click)="cancelPayment()" class="btn-secondary flex-1">
          Volver
        </button>
        <button
          (click)="confirmCheckout()"
          [disabled]="!selectedPayment"
          class="btn-primary flex-1 disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Confirmar Compra
        </button>
      </div>
    </div>

  </div>
</div>
